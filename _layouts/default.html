<style>
  :root { --ink:#0b0b0b; --ink2:#52514e; --rule:#e4e3df; --surface:#fcfcfb; --accent:#2a78d6; }
  body { margin:0; background:#f9f9f7; color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width: 1060px; margin: 0 auto; padding: 24px 20px 80px; }
  .site-nav { font-size: 14px; color: var(--ink2); border-bottom: 1px solid var(--rule); padding-bottom: 8px; margin-bottom: 16px; }
  .site-nav a { color: var(--ink2); margin-right: 14px; }
  h1 { font-size: 30px; line-height: 1.2; } h2 { margin-top: 2.2em; border-bottom: 1px solid var(--rule); padding-bottom: 4px; } h3 { margin-top: 1.6em; }
  a { color: var(--accent); }
  img { max-width: 100%; height: auto; }
  table { border-collapse: collapse; margin: 1em 0; font-size: 14px; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--rule); padding: 4px 9px; text-align: left; vertical-align: top; }
  th { background: #f0efec; }
  code { background: #f0efec; padding: 1px 4px; border-radius: 3px; font-size: 90%; }
  pre { background: #f0efec; padding: 12px; overflow-x: auto; border-radius: 4px; }
  pre code { background: none; padding: 0; }
  blockquote { border-left: 3px solid var(--rule); margin-left: 0; padding-left: 14px; color: var(--ink2); }
  .mjx-chtml { overflow-x: auto; overflow-y: hidden; }
  /* ---- 3D viewer ---- */
  .p4v { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; margin: 1em 0 1.5em; }
  .p4v-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; }
  .p4v-bar label { display: flex; align-items: center; gap: 6px; }
  .p4v-bar label > span { color: var(--ink2); }
  .p4v-bar select, .p4v-bar input[type=range] { font-size: 13px; max-width: 230px; }
  .p4v-legend { margin: 10px 0 6px; max-width: 460px; }
  .p4v-cbar { height: 12px; border-radius: 3px; border: 1px solid var(--rule); }
  .p4v-ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); }
  .p4v-panes { display: flex; flex-wrap: wrap; gap: 12px; }
  .p4v-pane { flex: 1 1 340px; min-width: 0; }
  .p4v-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .p4v-canvas { height: 380px; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .p4v-canvas canvas { width: 100% !important; height: 100% !important; display: block; touch-action: none; }
  .p4v-metrics table { font-size: 12px; display: table; width: 100%; margin: 8px 0 0; }
  .p4v-metrics td, .p4v-metrics th { padding: 2px 6px; }
  .p4v-metrics .ok { color: #006300; font-weight: 600; } .p4v-metrics .bad { color: #b42323; font-weight: 700; }
  .p4v-small { font-size: 12px; color: var(--ink2); }
  .p4v-tip { position: fixed; z-index: 10; background: #fff; border: 1px solid #cfcdc6; border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.45; pointer-events: none; box-shadow: 0 2px 10px rgba(0,0,0,.12); max-width: 260px; }
  @media (max-width: 600px) { .p4v-canvas { height: 300px; } main { padding: 14px 12px 60px; } h1 { font-size: 24px; } }
</style>
